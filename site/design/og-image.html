<!doctype html>
<!--
  Social card source of truth (D-17). 1200x630. Committed alongside the
  rendered PNG so the image can be regenerated exactly.

  Regenerate with a locally installed headless Chrome or Edge, from this
  directory:

    msedge --headless --disable-gpu --screenshot=../public/og.png \
      --window-size=1200,630 --default-background-color=00000000 og-image.html

  (or `chrome` in place of `msedge` if that is the locally installed browser)
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        background: #0a0a0a;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }
      .card {
        width: 1200px;
        height: 630px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px;
      }
      .wordmark {
        color: #a1a1a1;
        font-size: 24px;
        letter-spacing: -0.02em;
      }
      .headline {
        color: #fafafa;
        font-size: 60px;
        font-weight: 600;
        line-height: 1.12;
        letter-spacing: -0.02em;
        max-width: 980px;
      }
      .accent {
        color: #efa831;
      }
      .footer {
        display: flex;
        align-items: center;
        gap: 16px;
        color: #a1a1a1;
        font-size: 22px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #efa831;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="wordmark">outage-proof-livestream</div>
      <div class="headline">
        Keep your church livestream <span class="accent">on air</span> when the internet drops
      </div>
      <div class="footer">
        <span class="dot"></span>
        <span>Free. Open source. AGPL-3.0.</span>
      </div>
    </div>
  </body>
</html>
